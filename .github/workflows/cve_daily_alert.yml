name: Daily Security CVE & News Alert

on:
  schedule:
    # 한국 시간(KST) 매일 오전 8시 자동 실행 (UTC 23:00)
    - cron: '0 23 * * *'
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼 활성화

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 중복 방지 상태 파일 저장을 위한 저장소 커밋 권한
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run CVE & News Monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 cve_news_monitor.py --days 1 --cvss-min 7.0 --output security_briefing.md

      - name: Commit Updated State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cve_monitor_state.json security_briefing.md || true
          git commit -m "Auto-update vulnerability briefing & state [skip ci]" || true
          git push || true